<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Seehear — Sending…</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f6f6fb; color: #1b1b29;
    }
    @media (prefers-color-scheme: dark) { body { background: #12121a; color: #ececf3; } }
    .wrap { text-align: center; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 16px; border-radius: 50%;
      border: 3px solid rgba(155, 77, 255, .25); border-top-color: #9b4dff;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #e5484d; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p id="status">Sending the image…</p>
  </div>
  <script type="module" src="submit.js"></script>
</body>
</html>
